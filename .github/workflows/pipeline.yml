name: CI-CD Pipeline

on:
  push:
    branches: ["master"]

jobs:
  # PART 1: LOCAL BUILD & TEST
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin" # High-performance OpenJDK
          cache: "maven"

      - name: Build & Run Tests
        run: mvn -B clean verify

