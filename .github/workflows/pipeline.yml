name: CI-CD Pipeline

on:
  push:
    branches: ["master"]

jobs:
  # Local Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "zulu"
          cache: "maven"

      - name: Build and Analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Provided by GitHub automatically
        run: | 
          mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.qualitygate.wait=true  

  # Build Docker Images (Verify context and compilation)
  build-docker-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      APP_PATH: ./backend/career-assistant-api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Local Docker Build Check
        run: |
          # This catches Dockerfile syntax errors or JAR packaging issues before AWS work
          docker build --platform linux/arm64 -t local-check:latest $APP_PATH

  # Create ECR
  deploy-ecr:
    runs-on: ubuntu-latest
    environment: production
    needs: build-docker-image
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        # pinned to v4 stable
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Setup Terraform
        # pinned to v3.1.2
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        run: |
          BUCKET_NAME="${{ github.event.repository.name }}-tfstate-${{ github.repository_owner }}"
          terraform init -backend-config="bucket=${BUCKET_NAME}"
        working-directory: ./terraform

      - name: Create ECR Only
        # "targets" the ECR module so it creates the repo before trying to push
        run: terraform apply -target=module.ecr -auto-approve -input=false -var="api_image_uri=placeholder"
        working-directory: ./terraform

  # Push Docker Images to the ECR
  push-images-to-ecr:
    runs-on: ubuntu-latest
    needs: deploy-ecr # Waits for ECR to exist
    permissions:
      id-token: write
      contents: read
    outputs:
      api_image_uri: ${{ steps.build-api-image.outputs.image }}
    env:
      APP_PATH: ./backend/career-assistant-api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        # pinned to v4 stable
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        # pinned to v2 stable
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076

      - name: Build and Push
        id: build-api-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ github.event.repository.name }}-repo
          API_IMAGE_TAG: ${{ github.sha }}
        run: |
          API_IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$API_IMAGE_TAG
          docker build --platform linux/arm64 -t $API_IMAGE_URI $APP_PATH
          docker push $API_IMAGE_URI
          echo "image=$API_IMAGE_URI" >> $GITHUB_OUTPUT

  # Infrastructure Deployment
  deploy-infrastructure:
    runs-on: ubuntu-latest
    environment: production
    needs: push-images-to-ecr # Waits for the image to be in ECR
    permissions:
      id-token: write
      contents: read
    env:
      TF_LOG: DEBUG
      TF_VAR_project_name: ${{ github.event.repository.name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        # pinned to v4 stable
        uses: aws-actions/configure-aws-credentials@010d0da01d0b5a38af31e9c3470dbfdabdecca3a
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Setup Terraform
        # pinned to v3.1.2
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init
        run: |
          BUCKET_NAME="${{ github.event.repository.name }}-tfstate-${{ github.repository_owner }}"
          terraform init -input=false -backend-config="bucket=${BUCKET_NAME}"
        working-directory: ./terraform

      - name: Terraform Apply (Everything else)
        run: |
          # Now the pushed specific image URI is passed to the Terraform apply
          terraform apply -auto-approve -var="api_image_uri=${{ needs.build-and-push-docker.outputs.api_image_uri }}" -input=false
        working-directory: ./terraform
