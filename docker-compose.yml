version: '3.8'

services:
  # New PostgreSQL Service
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      - POSTGRES_DB=app_db
      - POSTGRES_USER=app_admin
      - POSTGRES_PASSWORD=securepassword
    ports:
      - "5432:5432" # Allows connecting from your IDE via localhost:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_admin -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - api-network
    volumes:
      - db-data:/var/lib/postgresql/data

  career-assistant-api:
    build:
      context: ./backend/career-assistant-api
      dockerfile: Dockerfile
    container_name: career-assistant-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # Use the 'db' service name as the hostname
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/app_db
      - SPRING_DATASOURCE_USERNAME=app_admin
      - SPRING_DATASOURCE_PASSWORD=securepassword
    depends_on:
      db:
        condition: service_healthy # Wait for DB to be ready
    networks:
      - api-network
    volumes:
      - api-data:/app/data
      - api-logs:/app/logs
    restart: unless-stopped

networks:
  api-network:
    driver: bridge

volumes:
  api-data:
  api-logs:
  db-data: # Persist database data between restarts