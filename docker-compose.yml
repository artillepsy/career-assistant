version: '3.8'

services:
  career-assistant-api:
    build:
      context: ./backend/career-assistant-api
      dockerfile: Dockerfile
    container_name: career-assistant-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - api-network
    volumes:
      - api-data:/app/data
      - api-logs:/app/logs
    restart: unless-stopped

networks:
  api-network:
    driver: bridge

volumes:
  api-data:
  api-logs:
